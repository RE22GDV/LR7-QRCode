[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr7-qrcode"
version = "1.0.0"
description = "Лабораторна робота №7: декодування QR-коду версії 1, код Ріда — Соломона (Codewars)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pillow>=10.0", "opencv-python-headless>=4.8", "reedsolo>=1.7"]

[project.scripts]
qrv1 = "qrv1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
